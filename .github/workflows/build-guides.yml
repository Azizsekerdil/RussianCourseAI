name: Kılavuzları Yenile

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Yenilenen PDF'leri main'e işle. Kapatılırsa PDF'ler yalnızca iş akışı çıktısı olarak saklanır."
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  guides:
    # Kilavuzlarin dizgisi Segoe UI ve Calibri ister; bu yazi tipleri yalnizca
    # Windows'ta bulunur. Depodaki PDF'ler de Windows'ta headless Chrome ile
    # uretilmistir (/Producer: Skia/PDF). Baska bir isletim sisteminde uretilen
    # PDF ayni metni tasir ama gorunumu degisir, o yuzden burasi windows-latest.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Bağımlılıklar
        run: python -m pip install --upgrade pip markdown pypdf
      - name: Kılavuzları üret
        run: python tools/build_manuals.py
      - name: Yenilenen PDF'leri işle
        if: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs; then
            echo "PDF'ler kaynak Markdown ile zaten uyumlu; islenecek degisiklik yok."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Kilavuzlar: PDF'leri kaynak Markdown'dan yeniden uret" \
                     -m "docs/*.md degistiginde PDF'ler geride kalmasin diye \"Kilavuzlari Yenile\" is akisiyla uretildi."
          git push
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: kilavuzlar-pdf
          path: docs/*.pdf
          if-no-files-found: error
          retention-days: 7
