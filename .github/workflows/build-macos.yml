name: macOS Paketi

on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: macOS uygulamasını oluştur
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh
      - name: Lisans denetimi (yayımlanan zip MIT koşullarıyla dağıtılabilir mi?)
        run: python tools/check_build_licence.py dist/RussianCourseAI-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RussianCourseAI-macOS
          path: dist/RussianCourseAI-macOS.zip
          if-no-files-found: error
