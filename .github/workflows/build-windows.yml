name: Windows Paketi

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Zip'in yuklenecegi surum etiketi (or. v1.3.1).
          Bos birakilirsa zip yalnizca is akisi ciktisi olarak saklanir.
        required: false
        default: ''

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      # Paket yalnizca requirements.txt'teki kutuphaneleri tasisin diye derleme
      # setup-python'un temiz yorumlayicisiyla yapilir; build.bat PATH uzerindeki
      # python'u kullanir.
      - name: Bagimliliklar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Windows uygulamasını oluştur
        run: .\build.bat /noshortcut
      - name: Lisans denetimi (yayımlanan zip MIT koşullarıyla dağıtılabilir mi?)
        run: python tools/check_build_licence.py dist/RussianCourseAI-Windows.zip
      # Zip'i DOGRUDAN surume yukle. Artifact deposu hesap genelinde bir kotaya
      # tabidir ve doldugunda upload-artifact adimi derlemeyi bosuna kirar;
      # surum ek dosyasi ise kalici adres oldugu icin asil dagitim yolu budur.
      - name: Zip'i surume yukle
        if: github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.inputs.release_tag }}" `
            dist/RussianCourseAI-Windows.zip --clobber `
            -R "${{ github.repository }}"

      # Artifact yalnizca kolaylik icindir: kota dolu olsa bile derleme basarili
      # sayilir, cunku zip yukaridaki adimda zaten surume yuklenmistir.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: RussianCourseAI-Windows
          path: dist/RussianCourseAI-Windows.zip
          if-no-files-found: error
          retention-days: 7
